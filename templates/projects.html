<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ t('projects.title') }}</title>
    <link href="/static/css/bootstrap.css" rel="stylesheet">
    <script src="/static/js/bootstrap.bundle.js"></script>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body class="bg-light">
    <!-- Navbar -->
    {% set active_page = 'projects' %}
    {% include 'partials/navbar.html' %}

    <!-- Main Content -->
    <div class="container mt-5 pt-5 text-center">
      <div class="row justify-content-center mt-5">
        <div class="col-md-8">
          <div class="card shadow-sm border-0 p-5">
            <div class="mb-3">
              <span class="badge bg-warning text-dark px-3 py-2 fs-6">{{ t('projects.status_dev') }}</span>
            </div>
            <h2 class="fw-bold mb-3">{{ t('projects.heading') }}</h2>
            <p class="text-muted fs-5 mb-4">{{ t('projects.desc') }}</p>
            <div class="d-flex justify-content-center gap-3">
              <a href="/inventory" class="btn btn-primary btn-lg">{{ t('projects.back_inventory') }}</a>
              <a href="/" class="btn btn-outline-secondary btn-lg">{{ t('projects.back_home') }}</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="text-center py-2 bg-dark text-light fixed-bottom">
      <small>{{ t('app.footer_copyright') }}</small>
    </footer>
  </body>
</html>
