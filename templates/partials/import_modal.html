<!-- Reusable Modal for Importing External Component to Inventory -->
<div class="modal fade" id="importToInventoryModal" tabindex="-1" aria-labelledby="importToInventoryModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="importToInventoryModalLabel">{{ t('libraries_common.quick_add_title') }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="p-2 border rounded bg-light mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="fw-bold text-primary" id="importPartName">...</span>
            <span class="badge" id="importSourceBadge">...</span>
          </div>
          <div class="small text-muted" id="importPartMeta">...</div>
        </div>

        <form id="importToInventoryForm">
          <input type="hidden" id="importSource" value="">
          <input type="hidden" id="importExtId" value="">

          <div class="mb-3">
            <label for="importLocation" class="form-label small fw-bold">{{ t('details.storage_location') }}</label>
            <input type="text" class="form-control" id="importLocation" placeholder="e.g. Box A-1, Drawer 3" value="Default Storage" required>
          </div>

          <div class="mb-3">
            <label for="importQuantity" class="form-label small fw-bold">{{ t('inventory.th_quantity') }}</label>
            <input type="number" class="form-control" id="importQuantity" min="0" value="10" required>
          </div>

          <div class="mb-3">
            <label for="importNote" class="form-label small fw-bold">{{ t('details.note') }}</label>
            <input type="text" class="form-control" id="importNote" placeholder="e.g. Initial batch purchase">
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold">{{ t('inventory.label_projects') }}</label>
            <div id="importProjectCheckboxes" class="border rounded p-2 bg-light" style="max-height: 140px; overflow-y: auto;">
              <small class="text-muted">{{ t('libraries_common.loading') }}</small>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">{{ t('libraries_common.btn_cancel') }}</button>
        <button type="button" class="btn btn-primary btn-sm" id="confirmImportBtn">{{ t('libraries_common.btn_confirm') }}</button>
      </div>
    </div>
  </div>
</div>
