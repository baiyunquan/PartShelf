<div class="mt-auto pt-3 border-top border-secondary">
  <div class="small text-muted mb-2">{{ t('app.language') }}</div>
  <div class="btn-group w-100" role="group" aria-label="{{ t('app.language') }}">
    <a href="{{ language_url('zh') }}" class="btn btn-sm {% if lang == 'zh' %}btn-primary{% else %}btn-outline-light{% endif %}">
      {{ t('app.lang_zh') }}
    </a>
    <a href="{{ language_url('en') }}" class="btn btn-sm {% if lang == 'en' %}btn-primary{% else %}btn-outline-light{% endif %}">
      {{ t('app.lang_en') }}
    </a>
  </div>
</div>
