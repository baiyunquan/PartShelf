<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ t('scan_import.title') }}</title>
    <link href="/static/css/bootstrap.css" rel="stylesheet">
    <link href="/static/css/scan_import.css" rel="stylesheet">
    <script src="/static/js/bootstrap.bundle.js"></script>
  </head>
  <body class="bg-light">
    {% include 'partials/navbar.html' %}
    <main id="scan-import-page" class="container-fluid scan-import-page" data-project-id="{{ project_id or '' }}">
      <header class="scan-project-bar card shadow-sm mb-3">
        <div class="card-body">
          <div class="row align-items-center g-2">
            <div class="col-md-5"><h1 class="h4 mb-1">{{ t('scan_import.title') }}</h1><p class="small text-muted mb-0">{{ t('scan_import.description') }}</p></div>
            <div class="col-md-7">
              <label for="scan-project" class="form-label fw-bold">{{ t('scan_import.project') }}</label>
              <select id="scan-project" class="form-select" disabled><option value="">{{ t('scan_import.loading_projects') }}</option></select>
              <p class="form-text mb-0">{{ t('scan_import.project_help') }}</p>
            </div>
          </div>
        </div>
      </header>
      <div class="row g-3">
        <section class="col-xl-5">
          <div class="card shadow-sm mb-3"><div class="card-body">
            <div class="d-flex gap-2 flex-wrap mb-2">
              <button id="scan-start" class="btn btn-primary" disabled>{{ t('scan_import.start_camera') }}</button>
              <button id="scan-stop" class="btn btn-outline-secondary" disabled>{{ t('scan_import.stop_camera') }}</button>
              <button id="scan-capture" class="btn btn-outline-primary" disabled>{{ t('scan_import.capture_photo') }}</button>
              <button id="scan-repeat" class="btn btn-outline-warning">{{ t('scan_import.repeat_camera') }}</button>
              <select id="scan-camera" class="form-select scan-camera-select" aria-label="{{ t('scan_import.camera') }}"></select>
            </div>
            <video id="scan-video" class="scan-video rounded" autoplay muted playsinline hidden></video>
            <p class="small text-muted mt-2">{{ t('scan_import.camera_help') }}</p>
            <label for="scan-image" class="form-label">{{ t('scan_import.upload') }}</label>
            <input id="scan-image" class="form-control" type="file" accept="image/jpeg,image/png,image/webp" disabled>
            <p id="scan-message" class="mt-3 mb-0" role="status" aria-live="polite">{{ t('scan_import.loading_projects') }}</p>
          </div></div>
          <div id="scan-review" class="card shadow-sm" hidden><div class="card-body">
            <h2 class="h5">{{ t('scan_import.review') }}</h2>
            <p id="scan-review-project" class="fw-bold"></p>
            <img id="scan-review-photo" class="scan-review-photo rounded mb-3" alt="{{ t('scan_import.photo') }}">
            <div id="scan-ai-note" class="alert alert-info py-2 px-3 small mb-3" hidden></div>
            <div id="scan-evidence" class="mb-3"></div>
            <div id="scan-candidates-section" class="mb-3" hidden>
              <label class="form-label fw-bold small text-muted">{{ t('scan_import.badge_ai_suggested') }}</label>
              <div id="scan-candidates-list" class="d-flex flex-column gap-2"></div>
            </div>
            <form id="scan-review-form">
              <label class="form-label" for="scan-review-code">{{ t('scan_import.number') }}</label>
              <input id="scan-review-code" class="form-control mb-2" pattern="[A-Za-z0-9._-]{1,64}" required>
              <label class="form-label" for="scan-review-quantity">{{ t('scan_import.quantity') }}</label>
              <input id="scan-review-quantity" class="form-control mb-2" type="number" min="1" max="2147483647" step="1" required>
              <label class="form-label" for="scan-review-note">{{ t('scan_import.note') }}</label>
              <input id="scan-review-note" class="form-control mb-2" maxlength="500">
              <div id="scan-new-package-wrap" class="form-check mb-3" hidden><input id="scan-new-package" type="checkbox" class="form-check-input"><label for="scan-new-package" class="form-check-label">{{ t('scan_import.new_package') }}</label></div>
              <button id="scan-review-confirm" class="btn btn-warning" type="submit">{{ t('scan_import.confirm_review') }}</button>
              <button id="scan-review-retry" class="btn btn-outline-primary" type="button">{{ t('scan_import.retry') }}</button>
            </form>
          </div></div>
        </section>
        <section class="col-xl-7">
          <div class="card shadow-sm"><div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 mb-0">{{ t('scan_import.recent') }}</h2><button id="scan-refresh" class="btn btn-outline-secondary btn-sm">{{ t('scan_import.refresh') }}</button></div>
            <div id="scan-history" class="scan-history"></div>
          </div></div>
        </section>
      </div>
    </main>
    <script id="page-translations" type="application/json">{{ page_translations | tojson }}</script>
    <script src="/static/js/vendor/zxing-wasm/reader.js"></script>
    <script src="/static/js/scan_label.js"></script>
    <script src="/static/js/scan_decoder.js"></script>
    <script src="/static/js/scan_import.js"></script>
  </body>
</html>
